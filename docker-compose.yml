services:
  dev:
    profiles: ['dev']
    build:
      context: .
      target: dev
    command: npm run dev -- --host 0.0.0.0 --port 3000
    ports:
      - '3000:3000'
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      NUXT_PUBLIC_SITE_URL: '${NUXT_PUBLIC_SITE_URL:-http://localhost:3000}'
      NUXT_PUBLIC_SITE_NAME: '${NUXT_PUBLIC_SITE_NAME:-Lucas Trentin — Engenheiro de Software}'
      NUXT_PUBLIC_SITE_DESCRIPTION: '${NUXT_PUBLIC_SITE_DESCRIPTION:-Engenheiro de Software, fullstack PHP/JS, Laravel, Vue.js, React e arquitetura de software.}'
      NUXT_PUBLIC_LINKEDIN_URL: '${NUXT_PUBLIC_LINKEDIN_URL:-https://linkedin.com/in/cezar-trentin}'
      NUXT_PUBLIC_GITHUB_URL: '${NUXT_PUBLIC_GITHUB_URL:-https://github.com/czarist}'

  prod:
    profiles: ['prod']
    build:
      context: .
      target: prod
    ports:
      - '3000:3000'
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NUXT_PUBLIC_SITE_URL: '${NUXT_PUBLIC_SITE_URL:-https://cezartrentin.dev}'
      NUXT_PUBLIC_SITE_NAME: '${NUXT_PUBLIC_SITE_NAME:-Lucas Trentin — Engenheiro de Software}'
      NUXT_PUBLIC_SITE_DESCRIPTION: '${NUXT_PUBLIC_SITE_DESCRIPTION:-Engenheiro de Software, fullstack PHP/JS, Laravel, Vue.js, React e arquitetura de software.}'
      NUXT_PUBLIC_LINKEDIN_URL: '${NUXT_PUBLIC_LINKEDIN_URL:-https://linkedin.com/in/cezar-trentin}'
      NUXT_PUBLIC_GITHUB_URL: '${NUXT_PUBLIC_GITHUB_URL:-https://github.com/czarist}'
